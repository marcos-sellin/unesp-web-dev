<!DOCTYPE html>
<html lang="en">

<!-- Toda a parte de configuração da página 
     css, javascript, entre outros-->
<head>
    <title>Primeira página</title>
    <meta charset="UTF-8">
</head>

<!-- Todo o conteúdo visível no navegador 
     textos, imagens, links, formulários, mapas, etc... -->
<body bgcolor="green">
    <!-- Cabeçalhos de h1 a h6 -->
    <h1>Testando o h1</h1>
    <h2>Testando o h2</h2>
    <h3 style="background-color: red;">Testando o h3</h3>
    <h4>Testando o h4</h4>
    <h5>Testando o h5</h5>
    <h6>Testando o h6</h6>
    <!-- Definir parágrafo -->
    <p align="right">definindo um <b><i>parágrafo</i></b></p>
    linha após o <br> parágrafo

    <!-- Inserir uma imagem -->
    <img src="./imagens/LogoUnesp.png" alt="LogoUnesp" width="150" height="50">

    <!-- Definir um link -->
    <p><a href="http://www.fct.unesp.br" target="_blank">link para pagina da unesp</a></p>

    <!-- Clicar na foto para ir para a página -->
    <p>Conheça a FCT</p>
    <p><a href="http://www.fct.unesp.br" target="_blank"><img src="./imagens/LogoUnesp.png" alt="LogoUnesp" width="150" height="50"></a></p>

    <!-- Exemplos de formatação de texto -->
    <p><b>testando</b></p>
    <p><i>testando</i></p>
    <p><u>testando</u></p>
    <p><big>testando</big></p>
    <p><strike>testando</strike></p>
</body>
</html>
